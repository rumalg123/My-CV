name: Build LSEG Targeted CV

on:
  push:
    branches:
      - lseg-moat-automation-cv
    paths:
      - "**/*.tex"
      - "**/*.sty"
      - ".github/workflows/lseg-cv-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lseg-cv-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lseg-cv:
    name: Build LSEG CV PDF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout LSEG CV branch
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            lmodern \
            texlive-fonts-recommended \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended

      - name: Compile LSEG CV
        shell: bash
        run: |
          set -euo pipefail

          latexmk \
            -pdf \
            -interaction=nonstopmode \
            -halt-on-error \
            -file-line-error \
            main.tex

          test -f main.pdf
          mv main.pdf Rumal_Gunawardana_CV_LSEG.pdf

      - name: Upload LSEG CV artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rumal_Gunawardana_CV_LSEG
          path: Rumal_Gunawardana_CV_LSEG.pdf
          if-no-files-found: error
          retention-days: 30
