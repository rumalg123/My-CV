name: Build Sysco Targeted CV

on:
  push:
    branches:
      - sysco-cloud-services-cv
    paths:
      - "**/*.tex"
      - "**/*.sty"
      - ".github/workflows/sysco-cv-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sysco-cv-build-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sysco-cv:
    name: Build Sysco CV PDF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Sysco CV branch
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            lmodern \
            texlive-fonts-recommended \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended

      - name: Compile Sysco CV
        shell: bash
        run: |
          set -euo pipefail

          latexmk \
            -pdf \
            -interaction=nonstopmode \
            -halt-on-error \
            -file-line-error \
            main.tex

          test -f main.pdf
          mv main.pdf Rumal_Gunawardana_CV_Sysco.pdf

      - name: Upload Sysco CV artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rumal_Gunawardana_CV_Sysco
          path: Rumal_Gunawardana_CV_Sysco.pdf
          if-no-files-found: error
          retention-days: 30
