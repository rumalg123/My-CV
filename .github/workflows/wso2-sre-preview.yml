name: Build WSO2 SRE application CV

on:
  push:
    branches:
      - applications/wso2-sre-2026
    paths:
      - "main.tex"
      - "resume.sty"
      - "applications/wso2_sre.tex"
      - ".github/workflows/wso2-sre-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Validate LaTeX and upload SRE PDF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application branch
        uses: actions/checkout@v4

      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk lmodern texlive-fonts-recommended \
            texlive-latex-base texlive-latex-extra texlive-latex-recommended

      - name: Compile PDF
        run: |
          set -euo pipefail
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error main.tex
          test -s main.pdf
          mv main.pdf Rumal_Gunawardana_Site_Reliability_Engineer.pdf

      - name: Upload CV preview
        uses: actions/upload-artifact@v4
        with:
          name: Rumal_Gunawardana_Site_Reliability_Engineer
          path: Rumal_Gunawardana_Site_Reliability_Engineer.pdf
          retention-days: 30
          if-no-files-found: error
